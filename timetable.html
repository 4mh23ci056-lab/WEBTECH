<!DOCTYPE html>
<html>
<head>
    <title>Class Time Table</title>
</head>
<body>

    <h2 align="center">CLASS TIME TABLE</h2>

    <table border="1" cellpadding="10"
           cellspacing="0" align="center">

        <tr>
            <th colspan="6">Weekly Time Table</th>
        </tr>

        <tr>
            <th>Day</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>11-12 PM</th>
            <th>12-1 PM</th>
            <th>1-2 PM</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Python</td>
            <td>Java</td>
            <td rowspan="2">Lab</td>
            <td colspan="2">Lunch Break</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>C</td>
            <td>HTML</td>
            <td>DBMS</td>
            <td>Maths</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td colspan="2">Programming Lab</td>
            <td>Python</td>
            <td>Java</td>
            <td>English</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>DBMS</td>
            <td>Maths</td>
            <td colspan="2">Sports</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Java</td>
            <td>HTML</td>
            <td>Python</td>
            <td colspan="2">Seminar</td>
        </tr>

    </table>

</body>
</html>
